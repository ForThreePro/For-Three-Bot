<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comandos - CYBER BOT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
    <div class="nav-container">
        <div class="logo">CYBER BOT</div>
        <div class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="comandos.html">Comandos</a>
            <a href="planes.html">Planes</a>
            <a href="faq.html">FAQ</a>
        </div>
    </div>
</nav>

<div class="container">
    <h1 style="color:var(--azul); margin-bottom:15px; font-size:1.6em">Centro de Comandos</h1>
    <p style="color:var(--texto-claro); margin-bottom:20px; font-size:0.9em">Toca para copiar</p>
    
    <input type="text" class="search" id="searchCmd" placeholder="Buscar comando...">

    <div class="card">
        <h2 style="color:var(--azul); margin-bottom:12px; font-size:1.1em">Administración</h2>
        <div class="cmd-grid">
            <div class="cmd">.promote @usuario</div>
            <div class="cmd">.kick @usuario</div>
            <div class="cmd">.mute @usuario</div>
            <div class="cmd">.link</div>
        </div>
    </div>

    <div class="card">
        <h2 style="color:var(--azul); margin-bottom:12px; font-size:1.1em">Descargas</h2>
        <div class="cmd-grid">
            <div class="cmd">.play</div>
            <div class="cmd">.ytmp3</div>
            <div class="cmd">.tiktok</div>
            <div class="cmd">.instagram</div>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
