<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comandos - CYBER BOT</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>💻 COMANDOS CYBER BOT</h1>
    <a href="index.html" class="btn" style="margin-bottom:20px">← Volver al Inicio</a>

    <input type="text" id="buscador" placeholder="🔍 Buscar comando...">
    <div id="descripcion" class="descripcion-box">Haz click en un comando para ver para qué sirve 👇</div>

    <div class="menu-section">
        <div class="menu-title">⚙️ CONFIG</div>
        <div class="command" data-desc="Activa o desactiva anti-link en el grupo">.antilink &lt;on/off&gt;</div>
        <div class="command" data-desc="Evita spam de mensajes seguidos">.antispam on/off</div>
        <div class="command" data-desc="Mensaje de bienvenida automático">.welcome on/off</div>
    </div>

    <div class="menu-section">
        <div class="menu-title">📥 DOWNLOADER</div>
        <div class="command" data-desc="Descarga música de YouTube">.play &lt;canción&gt;</div>
        <div class="command" data-desc="Descarga video de YouTube">.ytmp4 &lt;link&gt;</div>
        <div class="command" data-desc="Descarga videos de TikTok">.tiktok &lt;link&gt;</div>
    </div>

    <div class="menu-section">
        <div class="menu-title">🤖 INTELIGENCIA ARTIFICIAL</div>
        <div class="command" data-desc="Habla con GPT-4">.gpt4 &lt;texto&gt;</div>
        <div class="command" data-desc="Habla con Gemini de Google">.gemini &lt;texto&gt;</div>
    </div>

    <div class="btn-group">
        <a href="planes.html" class="btn">🛒 Ver Planes</a>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
