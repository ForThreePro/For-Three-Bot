<!DOCTYPE html>

<body>
    <div class="bg-gamer"></div>

    <section>
        <h2>> CENTRO DE SOPORTE_</h2>
        <div class="form-box">
            <h3>¿Tienes un problema con tu bot?</h3>
            <form id="formSoporte">
                <input type="text" id="nombreS" placeholder="Tu Nombre" required>
                <input type="text" id="idPedido" placeholder="ID de Pedido o Fecha" required>
                <textarea id="problema" placeholder="Describe el problema..." rows="5" required></textarea>
                <button type="submit">Enviar Ticket a WhatsApp</button>
            </form>
        </div>
        <div class="pago-box" style="margin-top: 30px;">
            <h3>📢 Únete al Grupo de Soporte</h3>
            <p>Ayuda entre usuarios y anuncios importantes</p>
            <a href="https://chat.whatsapp.com/LjPhgjqCM934QEzYz3vrVk" target="_blank" class="btn-grupo">Unirme al Grupo</a>
        </div>
    </section>
    <script src="script.js"></script>
