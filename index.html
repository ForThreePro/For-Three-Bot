<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rayo Prem Bot | Yallico</title>
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <div class="fondo-animado"></div>
  
  <div class="container">
    <header>
      <div class="logo">⚡ RAYO PREM BOT</div>
      <p class="sub">by YALLICO</p>
      <button id="btnPais" onclick="abrirSelectorPais()">PAÍS: PERÚ</button>
      <div class="garantia">7 DÍAS DE GARANTÍA O DEVOLUCIÓN</div>
      <a href="https://wa.me/51936994155" class="btn">HABLAR CON YALLICO</a>
    </header>

    <section>
      <h2 class="titulo">PLANES</h2>
      <div class="grid">
        <div class="card"><h3>BASIC</h3><p class="pre">S/7</p><button onclick="abrirPago('BASIC',7)">COMPRAR</button></div>
        <div class="card pro"><span>TOP</span><h3>PREM</h3><p class="pre">S/30</p><button onclick="abrirPago('PREM',30)">COMPRAR</button></div>
        <div class="card"><h3>WEB PRO</h3><p class="pre">S/30</p><button onclick="abrirPago('WEB PRO',30)">COMPRAR</button></div>
      </div>
    </section>
  </div>

  <div id="popup" class="popup">
    <div class="box">
      <span onclick="cerrarPago()">X</span>
      <h2 id="nomPlan"></h2>
      <select id="pais" onchange="cambiarPais()">
        <option value="PEN">🇵🇪 Perú</option><option value="MXN">🇲🇽 México</option>
        <option value="CLP">🇨🇱 Chile</option><option value="COP">🇨🇴 Colombia</option>
      </select>
      <h1 id="precio">S/0</h1>
      <div id="pagos">
        <div id="yapeBox"><b>Yape:</b> 936994155 <button onclick="copiar('yape')">COPIAR</button><p id="yape" hidden>936994155</p></div>
        <div><b>Prex:</b> 12249975 <button onclick="copiar('prex')">COPIAR</button><p id="prex" hidden>12249975</p></div>
        <div><b>Global:</b> @CRIROJ1855 <button onclick="copiar('global')">COPIAR</button><p id="global" hidden>@CRIROJ1855</p></div>
      </div>
      <a href="https://wa.me/51936994155" target="_blank" class="btn">ENVIAR CAPTURA</a>
    </div>
  </div>

  <audio id="musica" src="Musica.mp3" loop></audio>
  <button id="btnMusica" onclick="toggleMusica()">🔊</button>
<script src="script.js?v=10"></script>
</body>
</html>
