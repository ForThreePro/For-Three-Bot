<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>VENTAS BOT PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
nav{background:#fff;padding:15px 30px;display:flex;justify-content:space-between;box-shadow:0 2px 10px #0001;position:sticky;top:0;z-index:10}
.btn{padding:10px 20px;border-radius:8px;font-weight:600;cursor:pointer;border:none}
.btn-blue{background:#0066ff;color:#fff}.btn-green{background:#25D366;color:#fff}.btn-red{background:#da3633;color:#fff}
.btn-disabled{background:#ccc;color:#666;cursor:not-allowed}
.banner{position:relative;text-align:center;color:#fff}
.banner img{width:100%;height:400px;object-fit:cover;filter:brightness(0.4)}
.banner-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#0008;justify-content:center;align-items:center;z-index:999}
.modal-box{background:#fff;padding:30px;border-radius:15px;width:90%;max-width:400px}
input{width:100%;padding:12px;margin:10px 0;border:2px solid #ddd;border-radius:8px}
.container{max-width:1100px;margin:auto;padding:60px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:25px}
.card{background:#fff;padding:30px;border-radius:15px;text-align:center;box-shadow:0 4px 15px #0001;position:relative}
.precio{font-size:3em;font-weight:900;color:#0066ff}
#welcomeMsg{color:#25D366;font-weight:700}
.bloqueo{position:absolute;top:0;left:0;right:0;bottom:0;background:#0006;display:flex;justify-content:center;align-items:center;border-radius:15px;color:#fff;font-weight:700;font-size:1.2em}
</style>
</head>
<body>

<nav>
  <b>🤖 VENTAS BOT PRO</b>
  <div>
    <span id="welcomeMsg"></span>
    <button class="btn btn-blue" id="btnLogin" onclick="openModal('login')">Iniciar Sesión</button>
    <button class="btn btn-green" id="btnReg" onclick="openModal('register')">Registrarse</button>
    <button class="btn btn-red" id="btnLogout" onclick="logout()" style="display:none">Salir</button>
  </div>
</nav>

<div class="banner">
  <img src="https://files.evogb.win/CJOWbF.jpg">
  <div class="banner-text">
    <h1>+100 Comandos Profesionales</h1>
    <p>Regístrate para desbloquear la compra</p>
  </div>
</div>

<div class="container">
  <h2 style="text-align:center;margin-bottom:30px">Elige tu Plan</h2>
  <div class="grid">
    <!-- CARD 1 -->
    <div class="card" id="card1">
      <div class="bloqueo" id="lock1">🔒 INICIA SESIÓN</div>
      <h3>BÁSICO</h3><div class="precio">S/20</div>
      <button class="btn btn-disabled" id="buy1" onclick="comprar('BASICO')">Comprar</button>
    </div>
    <!-- CARD 2 -->
    <div class="card" id="card2">
      <div class="bloqueo" id="lock2">🔒 INICIA SESIÓN</div>
      <h3>PREMIUM</h3><div class="precio">S/40</div>
      <button class="btn btn-disabled" id="buy2" onclick="comprar('PREMIUM')">Comprar</button>
    </div>
    <!-- CARD 3 -->
    <div class="card" id="card3">
      <div class="bloqueo" id="lock3">🔒 INICIA SESIÓN</div>
      <h3>VIP</h3><div class="precio">S/70</div>
      <button class="btn btn-disabled" id="buy3" onclick="comprar('VIP')">Comprar</button>
    </div>
  </div>
</div>

<!-- MODAL LOGIN -->
<div id="login" class="modal"><div class="modal-box">
  <h2>Iniciar Sesión <span onclick="closeModal('login')" style="float:right;cursor:pointer">&times;</span></h2>
  <input id="loginUser" type="text" placeholder="Usuario">
  <input id="loginPass" type="password" placeholder="Contraseña">
  <button class="btn btn-blue" onclick="login()">Entrar</button>
</div></div>

<!-- MODAL REGISTRO -->
<div id="register" class="modal"><div class="modal-box">
  <h2>Crear Cuenta <span onclick="closeModal('register')" style="float:right;cursor:pointer">&times;</span></h2>
  <input id="regUser" type="text" placeholder="Crea un usuario">
  <input id="regPass" type="password" placeholder="Crea una contraseña">
  <button class="btn btn-green" onclick="register()">Registrarse</button>
</div></div>

<script>
function openModal(id){document.getElementById(id).style.display='flex'}
function closeModal(id){document.getElementById(id).style.display='none'}

// REGISTRAR
function register(){
  let user = regUser.value; let pass = regPass.value;
  if(user=="" || pass==""){ alert("Completa todo"); return; }
  localStorage.setItem('user_' + user, pass);
  alert("✅ Cuenta creada! Ahora inicia sesión");
  closeModal('register');
}

// LOGIN
function login(){
  let user = loginUser.value; let pass = loginPass.value;
  let savedPass = localStorage.getItem('user_' + user);
  if(savedPass && savedPass == pass){
    localStorage.setItem('loggedUser', user);
    checkLogin();
    alert("✅ Bienvenido " + user + "! Ya puedes comprar");
    closeModal('login');
  } else { alert("❌ Usuario o contraseña incorrectos"); }
}

// LOGOUT
function logout(){
  localStorage.removeItem('loggedUser');
  checkLogin();
}

// COMPRAR
function comprar(plan){
  let user = localStorage.getItem('loggedUser');
  if(!user){ alert("Debes iniciar sesión primero"); return; }
  window.open(`https://wa.me/51936994155?text=Hola%20soy%20${user}%20quiero%20comprar%20plan%20${plan}`, '_blank')
}

// VERIFICAR SI ESTA LOGUEADO
function checkLogin(){
  let user = localStorage.getItem('loggedUser');
  if(user){
    welcomeMsg.innerText = `Hola, ${user} 👋`;
    btnLogin.style.display = 'none'; btnReg.style.display = 'none'; btnLogout.style.display = 'inline';

    // DESBLOQUEAR BOTONES
    for(let i=1; i<=3; i++){
      document.getElementById('lock'+i).style.display = 'none';
      document.getElementById('buy'+i).classList.remove('btn-disabled');
      document.getElementById('buy'+i).classList.add('btn-green');
    }
  } else {
    welcomeMsg.innerText = '';
    btnLogin.style.display = 'inline'; btnReg.style.display = 'inline'; btnLogout.style.display = 'none';

    // BLOQUEAR BOTONES
    for(let i=1; i<=3; i++){
      document.getElementById('lock'+i).style.display = 'flex';
      document.getElementById('buy'+i).classList.add('btn-disabled');
      document.getElementById('buy'+i).classList.remove('btn-green');
    }
  }
}
checkLogin();
</script>
</body>
</html>
