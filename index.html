<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYNCRA AI | Automatiza tu WhatsApp</title>
<link rel="stylesheet" href="style.css?v=21">
</head>
<body>

  <div class="container">
    <nav>
      <div class="logo">SYNCRA<span>AI</span></div>
      <div class="nav-actions">
        <select id="paisTop" onchange="cambiarPaisTop()"><option value="PEN">🇵🇪 PEN</option><option value="MXN">🇲🇽 MXN</option><option value="CLP">🇨🇱 CLP</option><option value="COP">🇨🇴 COP</option></select>
        <button id="btnMusica" onclick="toggleMusica()">🔊</button>
      </div>
    </nav>

    <header>
      <h1>Convierte cada chat<br><span>en una venta</span></h1>
      <p>SYNCRA es el cerebro de IA para tu WhatsApp. Atiende 1000 clientes a la vez.</p>
      <div class="cta">
        <a href="https://wa.me/51936994155" class="btn-blue">Empezar Gratis</a>
        <a href="#planes" class="btn-white">Ver Precios</a>
      </div>
    </header>

    <section id="planes" class="planes">
      <h2>Planes Simples</h2>
      <div class="cards">
        <div class="card"><h3>Básico</h3><div class="price" data-pen="S/7" data-mxn="$130" data-clp="$7000" data-cop="$28000">S/7</div><button onclick="abrirPago('Básico',7)">Elegir</button></div>
        <div class="card pro"><h3>Pro</h3><div class="price" data-pen="S/30" data-mxn="$550" data-clp="$30000" data-cop="$120000">S/30</div><button onclick="abrirPago('Pro',30)">Elegir</button></div>
        <div class="card"><h3>Tienda</h3><div class="price" data-pen="S/30" data-mxn="$550" data-clp="$30000" data-cop="$120000">S/30</div><button onclick="abrirPago('Tienda',30)">Elegir</button></div>
      </div>
    </section>
  </div>

  <!-- CHECKOUT BLANCO MINIMALISTA -->
  <div id="popup" class="popup">
    <div class="modal-white">
      <span class="close" onclick="cerrarPago()">×</span>
      <h2>Completa tu compra</h2>
      <div class="resumen"><b id="nomPlan"></b><span id="precio"></span></div>
      <label>País</label>
      <select id="pais" onchange="cambiarPais()"><option value="PEN">Perú</option><option value="MXN">México</option><option value="CLP">Chile</option><option value="COP">Colombia</option></select>
      <label>Pagar con</label>
      <div id="metodosPago"></div>
      <button class="btn-final" onclick="enviarWsp()">Enviar comprobante por WhatsApp</button>
    </div>
  </div>

  <audio id="musica" src="Musica.mp3" loop></audio>
<script src="script.js?v=21"></script>
</body>
</html>
