<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rayo Prem Bot by Yallico</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <img id="videoFondo" src="./Fondo.gif">
  <div class="capa-oscura"></div>

  <div class="container">
    <header>
      <div class="logo">⚡ RAYO PREM BOT</div>
      <button id="btnPais" onclick="abrirSelectorPais()">⚡ País: Perú</button>
      <div class="garantia">⚡ GARANTÍA RAYO: 7 días o te devuelvo tu dinero</div>
      <a href="https://wa.me/51936994155" class="btn">HABLAR CON YALLICO</a>
    </header>

    <section class="planes">
      <h2 class="titulo">ELIGE TU PLAN</h2>
      <div class="grid">
        <div class="card"><h3>Rayo Bot Basic</h3><div class="precio">S/7</div><button class="btn-comprar" onclick="abrirPago('Rayo Bot Basic',7)">LO QUIERO</button></div>
        <div class="card destacado"><div class="etiqueta">MÁS VENDIDO</div><h3>Rayo Bot Prem</h3><div class="precio">S/30</div><button class="btn-comprar" onclick="abrirPago('Rayo Bot Prem',30)">LO QUIERO</button></div>
        <div class="card"><h3>Rayo Web Pro</h3><div class="precio">S/30</div><button class="btn-comprar" onclick="abrirPago('Rayo Web Pro',30)">LO QUIERO</button></div>
      </div>
    </section>
  </div>

  <div id="popupPago" class="popup">
    <div class="popup-content">
      <span class="cerrar" onclick="cerrarPago()">&times;</span>
      <h2>Compra: <span id="nombrePlan"></span></h2>
      <label>Elige tu país:</label>
      <select id="selectorPais" onchange="cambiarPais()">
        <option value="PEN">🇵🇪 Perú - PEN</option>
        <option value="MXN">🇲🇽 México - MXN</option>
        <option value="CLP">🇨🇱 Chile - CLP</option>
        <option value="COP">🇨🇴 Colombia - COP</option>
      </select>
      <p class="total">Total: <span id="precioConvertido">S/0</span></p>
      <div class="pagos">
        <p><b>Yape:</b> 936994155</p>
        <p><b>Prex:</b> 12249975</p>
        <p><b>Global66:</b> @CRIROJ1855</p>
      </div>
      <a id="btnWhats" href="https://wa.me/51936994155" target="_blank" class="btn">ENVIAR CAPTURA A WHATSAPP</a>
    </div>
  </div>

  <audio id="musicaFondo" src="./Musica.mp3" loop></audio>
  <button id="btnMusica" onclick="toggleMusica()">🔊</button>
<script src="script.js?v=3"></script>
</body>
</html>
