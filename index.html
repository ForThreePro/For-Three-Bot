<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Rayo Prem Bot by Yallico</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <img id="videoFondo" src="./Fondo.gif">
  <div class="capa-oscura"></div>

  <div class="container">
    <header>
      <div class="logo">⚡ RAYO PREM BOT</div>
      <button id="btnPais" onclick="abrirSelectorPais()">⚡ País: Perú</button>
      <div class="garantia">⚡ GARANTÍA RAYO: 7 días o te devuelvo tu dinero</div>
      <a href="https://wa.me/51936994155" class="btn">HABLAR CON YALLICO</a>
    </header>

    <section class="planes">
      <h2 class="titulo">ELIGE TU PLAN</h2>
      <div class="grid">
        <div class="card"><h3>Rayo Bot Basic</h3><div class="precio">S/7</div><button onclick="abrirPago('Rayo Bot Basic',7)">LO QUIERO</button></div>
        <div class="card destacado"><h3>Rayo Bot Prem</h3><div class="precio">S/30</div><button onclick="abrirPago('Rayo Bot Prem',30)">LO QUIERO</button></div>
        <div class="card"><h3>Rayo Web Pro</h3><div class="precio">S/30</div><button onclick="abrirPago('Rayo Bot Web Pro',30)">LO QUIERO</button></div>
      </div>
    </section>
  </div>

  <div id="popupPago" class="popup">
    <div class="popup-content">
      <span onclick="cerrarPago()">&times;</span>
      <h2>Compra: <span id="nombrePlan"></span></h2>
      <select id="selectorPais" onchange="cambiarPais()">
        <option value="PEN">🇵🇪 Perú</option>
        <option value="MXN">🇲🇽 México</option>
        <option value="CLP">🇨🇱 Chile</option>
        <option value="COP">🇨🇴 Colombia</option>
      </select>
      <p>Total: <span id="precioConvertido"></span></p>
      <div>Yape: 936994155</div>
      <div>Prex: 12249975</div>
      <div>Global66: @CRIROJ1855</div>
      <a id="btnWhats" href="#">ENVIAR CAPTURA</a>
    </div>
  </div>

  <audio id="musicaFondo" src="./Musica.mp3" loop></audio>
  <button id="btnMusica" onclick="toggleMusica()">🔊</button>
<script src="script.js"></script>
</body>
</html>
