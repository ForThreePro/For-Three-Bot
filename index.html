<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rayo Prem Bot | Yallico</title>
<link rel="stylesheet" href="style.css?v=9">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
  <img id="videoFondo" src="./Fondo.gif" alt="fondo">
  
  <div class="container">
    <header>
      <div class="logo">⚡ RAYO PREM BOT</div>
      <p class="sublogo">by YALLICO</p>
      <button id="btnPais" onclick="abrirSelectorPais()">PAÍS: PERÚ</button>
      <div class="garantia">GARANTÍA: 7 DÍAS O TE DEVUELVO TU DINERO</div>
      <a href="https://wa.me/51936994155" class="btn">HABLAR CON YALLICO</a>
    </header>

    <section class="planes">
      <h2 class="titulo">ELIGE TU PLAN</h2>
      <div class="grid">
        <div class="card"><h3>BASIC</h3><div class="precio">S/7</div><button class="btn-comprar" onclick="abrirPago('BASIC',7)">COMPRAR</button></div>
        <div class="card destacado"><span class="tag">TOP</span><h3>PREM</h3><div class="precio">S/30</div><button class="btn-comprar" onclick="abrirPago('PREM',30)">COMPRAR</button></div>
        <div class="card"><h3>WEB PRO</h3><div class="precio">S/30</div><button class="btn-comprar" onclick="abrirPago('WEB PRO',30)">COMPRAR</button></div>
      </div>
    </section>
  </div>

  <div id="popupPago" class="popup">
    <div class="popup-content">
      <span class="cerrar" onclick="cerrarPago()">&times;</span>
      <h2><span id="nombrePlan"></span></h2>
      <select id="selectorPais" onchange="cambiarPais()">
        <option value="PEN">🇵🇪 Perú</option><option value="MXN">🇲🇽 México</option>
        <option value="CLP">🇨🇱 Chile</option><option value="COP">🇨🇴 Colombia</option>
      </select>
      <p class="total"><span id="precioConvertido">S/0</span></p>
      
      <div class="pagos" id="contenedorPagos">
        <div class="metodo" id="pago-yape"><b>Yape:</b> <span id="yape">936994155</span> <button onclick="copiar('yape')">COPIAR</button></div>
        <div class="metodo"><b>Prex:</b> <span id="prex">12249975</span> <button onclick="copiar('prex')">COPIAR</button></div>
        <div class="metodo"><b>Global66:</b> <span id="global">@CRIROJ1855</span> <button onclick="copiar('global')">COPIAR</button></div>
      </div>
      <a href="https://wa.me/51936994155" target="_blank" class="btn">ENVIAR CAPTURA</a>
    </div>
  </div>

  <audio id="musicaFondo" src="Musica.mp3" loop></audio>
  <button id="btnMusica" onclick="toggleMusica()">🔊</button>
<script src="script.js?v=9"></script>
</body>
</html>
