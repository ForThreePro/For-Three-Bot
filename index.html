<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Son Goku - El Guerrero Saiyan</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@700&display=swap');
    * { margin: 0; padding: 0; }
  body { background: #000; overflow: hidden; }
  
  .hero {
    height: 100vh;
    background: url('https://files.evogb.win/f8g1F2.jpg') center/cover no-repeat;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; text-align: center;
    position: relative;
  }
  .hero::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(255,107,0,0.5) 100%);
  }
  .hero-content { position: relative; z-index: 2; }
  
  h1 {
    font-family: 'Bangers', cursive; font-size: 6rem;
    color: #ffd700; text-shadow: 5px 5px 0px #ff0000, 0 0 40px #ff6b00;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  
  .btn-ki {
    display: inline-block; margin-top: 20px;
    background: linear-gradient(90deg, #ff0000, #ff6b00);
    color: white; padding: 20px 45px; border-radius: 50px;
    text-decoration: none; font-family: 'Orbitron', sans-serif;
    font-weight: 700; font-size: 1.4rem; border: 3px solid #ffd700;
    box-shadow: 0 0 30px rgba(255,107,0,0.8); transition: 0.3s;
  }
  .btn-ki:hover { transform: scale(1.15); box-shadow: 0 0 60px #ff0000; }
  
  .btn-music {
    background: linear-gradient(90deg, #ff0000, #ff6b00);
    color: white; border: none; padding: 15px 30px;
    border-radius: 50px; font-family: 'Bangers', cursive; font-size: 1.2rem; cursor: pointer;
    margin-top: 15px; border: 2px solid #ffd700;
  }
  .btn-music:hover { transform: scale(1.1); }
</style>
</head>
<body>
  <audio id="gokuAudio" loop><source src="goku.mp3" type="audio/mpeg"></audio>
  
  <div class="hero">
    <div class="hero-content">
      <h1>SON GOKU</h1>
      <p style="font-size:1.6rem; color:white; text-shadow:2px 2px 4px #000;">El Guerrero Saiyan</p>
      
      <button class="btn-music" onclick="toggleMusic()">▶️ REPRODUCIR MÚSICA</button>
      <br>
      <a href="productos.html" class="btn-ki">ENTRAR A LA BATALLA</a>
    </div>
  </div>

<script>
  const audio = document.getElementById('gokuAudio');
  const btn = document.querySelector('.btn-music');
  
  // Cargar estado de la música
  window.onload = () => {
    if(localStorage.getItem('musicPlaying') === 'true') {
      audio.currentTime = localStorage.getItem('musicTime') || 0;
      audio.play();
      btn.innerHTML = '⏸️ PAUSAR MÚSICA';
    }
  }
  
  // Guardar tiempo cada segundo
  setInterval(() => {
    if(!audio.paused) {
      localStorage.setItem('musicTime', audio.currentTime);
    }
  }, 1000);
  
  function toggleMusic() {
    if(audio.paused) {
      audio.play();
      btn.innerHTML = '⏸️ PAUSAR MÚSICA';
      localStorage.setItem('musicPlaying', 'true');
    } else {
      audio.pause();
      btn.innerHTML = '▶️ REPRODUCIR MÚSICA';
      localStorage.setItem('musicPlaying', 'false');
    }
  }
  
  // Guardar antes de irse
  window.onbeforeunload = () => {
    localStorage.setItem('musicTime', audio.currentTime);
  }
</script>
</body>
</html>
